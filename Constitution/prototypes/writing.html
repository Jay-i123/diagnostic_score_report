<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic Writing Assessment (DWA) — Task Browser</title>
<style>
  :root {
    --teal: #0D7377;
    --teal-light: #E8F5F5;
    --teal-dark: #095456;
    --dark: #1A1A2E;
    --grey: #555555;
    --light-grey: #F5F5F5;
    --border: #E0E0E0;
    --correct: #2E7D32;
    --correct-bg: #E8F5E9;
    --info-bg: #FFF8E1;
    --write-bg: #E3F2FD;
    --write-accent: #1565C0;
    --email-bg: #FFF3E0;
    --email-accent: #E65100;
    --ml-bg: #F3E5F5;
    --ml-accent: #7B1FA2;
    --audio-bg: #EDE7F6;
    --audio-accent: #5E35B1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--light-grey); color: var(--dark); line-height: 1.6; }

  .header { background: var(--teal); color: white; padding: 24px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .header .badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-left: auto; white-space: nowrap; }

  .container { display: flex; min-height: calc(100vh - 80px); }
  .sidebar { width: 290px; min-width: 290px; background: white; border-right: 1px solid var(--border); overflow-y: auto; position: sticky; top: 80px; height: calc(100vh - 80px); }
  .sidebar-section { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .sidebar-section:last-child { border-bottom: none; }
  .stage-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--teal); padding: 8px 20px 4px; }
  .stage-label .stage-time { font-weight: 400; color: var(--grey); text-transform: none; letter-spacing: 0; }
  .nav-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; font-size: 13px; color: var(--dark); transition: all 0.15s; gap: 10px; border-left: 3px solid transparent; }
  .nav-item:hover { background: var(--teal-light); }
  .nav-item.active { background: var(--teal-light); border-left-color: var(--teal); font-weight: 600; }
  .nav-item .task-code { background: var(--teal); color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; min-width: 34px; text-align: center; }

  .main { flex: 1; padding: 32px 40px; max-width: 920px; }
  .task-header { margin-bottom: 24px; }
  .task-header .task-type-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--teal); color: white; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
  .task-header h2 { font-size: 24px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
  .task-header .subskills { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12.5px; color: var(--teal); margin-bottom: 8px; }
  .task-header .description { font-size: 14px; color: var(--grey); line-height: 1.5; }

  .item-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 24px; overflow: hidden; border: 1px solid var(--border); }
  .item-card .item-label { background: var(--light-grey); padding: 10px 20px; font-size: 12px; font-weight: 700; color: var(--grey); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .difficulty { margin-left: auto; font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; padding: 2px 8px; border-radius: 10px; }
  .difficulty.easy { background: #E8F5E9; color: #2E7D32; }
  .difficulty.moderate { background: #FFF3E0; color: #E65100; }
  .difficulty.hard { background: #FFEBEE; color: #C62828; }
  .card-body { padding: 20px; }

  /* AUDIO BOX */
  .audio-box { background: var(--audio-bg); border: 1px solid #D1C4E9; border-radius: 8px; padding: 14px 18px; margin-bottom: 14px; }
  .audio-box .audio-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--audio-accent); margin-bottom: 8px; }
  .audio-box .audio-text { font-size: 15px; font-weight: 500; }
  .audio-box .audio-meta { font-size: 11px; color: var(--grey); font-style: italic; margin-top: 6px; }

  /* TYPING BOX */
  .typing-box { background: white; border: 2px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-bottom: 14px; }
  .typing-box .typing-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--write-accent); margin-bottom: 8px; }
  .typing-input { width: 100%; padding: 12px 14px; border: 2px dashed var(--border); border-radius: 6px; font-size: 15px; color: var(--grey); font-style: italic; background: #FAFBFC; min-height: 44px; }
  .typing-input.large { min-height: 120px; }

  /* PROMPT BOX */
  .prompt-box { background: var(--write-bg); border: 1px solid #BBDEFB; border-radius: 8px; padding: 16px 20px; margin-bottom: 14px; }
  .prompt-box .prompt-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--write-accent); margin-bottom: 10px; }
  .prompt-box .prompt-text { font-size: 14px; line-height: 1.6; }
  .prompt-box .prompt-meta { margin-top: 8px; font-size: 11px; color: var(--grey); font-style: italic; }

  /* CLOZE / WORD CHIPS */
  .word-chip { display: inline-block; background: white; border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; font-size: 15px; font-weight: 500; }
  .gap-blank { display: inline-block; min-width: 56px; border-bottom: 2px solid var(--write-accent); text-align: center; font-weight: 700; color: var(--write-accent); }

  /* EMAIL INTERFACE */
  .email-interface { background: white; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 14px; }
  .email-header { background: var(--email-accent); color: white; padding: 10px 16px; font-size: 13px; font-weight: 700; }
  .email-fields { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .email-fields div { margin-bottom: 4px; }
  .email-fields .label { font-weight: 700; color: var(--grey); display: inline-block; width: 56px; }
  .email-body { padding: 16px; min-height: 90px; }

  /* SCORING BOX */
  .scoring-box { background: var(--correct-bg); border: 1px solid #C8E6C9; border-radius: 8px; padding: 14px 18px; margin-bottom: 14px; }
  .scoring-box .scoring-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--correct); margin-bottom: 8px; }
  .scoring-box .scoring-text { font-size: 13px; line-height: 1.5; }
  .criteria-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .criteria-tag { background: white; border: 1px solid #A5D6A7; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--correct); }

  /* ML MODEL BOX */
  .ml-box { background: var(--ml-bg); border: 1px solid #CE93D8; border-radius: 8px; padding: 14px 18px; margin-bottom: 14px; }
  .ml-box .ml-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ml-accent); margin-bottom: 8px; }
  .ml-box .ml-text { font-size: 13px; line-height: 1.6; }
  .ml-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ml-stat { background: white; border: 1px solid #CE93D8; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--ml-accent); }

  /* GENERIC TABLE */
  .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
  .data-table th, .data-table td { padding: 8px 10px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
  .data-table th { background: var(--teal); color: white; font-size: 11px; text-transform: uppercase; }
  .data-table tr:nth-child(even) { background: #FAFBFC; }
  .data-table .band-num { font-weight: 700; color: var(--teal); text-align: center; width: 40px; }

  .explanation { padding: 14px; background: var(--info-bg); border-radius: 8px; font-size: 13px; line-height: 1.6; }
  .explanation .exp-label { font-weight: 700; color: #F57F17; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

  .acara-note { padding: 12px 14px; background: var(--teal-light); border-radius: 8px; font-size: 12.5px; line-height: 1.5; margin-bottom: 14px; border-left: 3px solid var(--teal); }
  .acara-note .acara-label { font-weight: 700; color: var(--teal); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

  .exit-banner { background: #FFF3E0; border: 2px solid #FFB74D; border-radius: 8px; padding: 12px 20px; margin-bottom: 16px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .exit-banner .exit-icon { font-size: 20px; }
  .exit-banner .exit-text { font-weight: 600; color: #E65100; }
  .exit-banner .exit-detail { color: var(--grey); font-size: 12px; }

  .nav-btn { display: inline-block; padding: 10px 20px; background: var(--teal); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .nav-btn:hover { background: var(--teal-dark); }
  .nav-btn.secondary { background: #555; }

  @media (max-width: 900px) { .sidebar { display: none; } .main { padding: 20px; } }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Diagnostic Writing Assessment</h1>
    <div class="subtitle">Task Browser &mdash; DWA v4.2 &bull; Australian Curriculum English v9.0 &middot; ACARA EAL/D Progression</div>
  </div>
  <div class="badge">Secondary &bull; Years 7&ndash;12</div>
</div>

<div class="container">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<script>
const TASKS = [
  // ===== STAGE 1: DISCRETE / CONSTRAINED =====
  {
    stage: 1, kind: "dictation", taskCode: "W1", taskName: "Write from Dictation — Word Level",
    subskills: "Phoneme–grapheme mapping • Spelling (regular & irregular)",
    description: "Student hears a word spoken aloud (Australian English, repeated once) and types it. The foundational encoding operation: mapping a heard word to its written form.",
    timing: "~10–15 sec/item • 4–6 items",
    acara: "Beginning–Emerging: “developing knowledge of letter–sound relationships in writing; spelling high-frequency words with increasing accuracy.”",
    samples: [
      {
        label: "Regular word", difficulty: "easy",
        audio: { text: '"market"', meta: "Clear Australian English, natural pace, repeated once after a 2–3 second pause" },
        instruction: "Type the word you hear.",
        scoring: "Binary: correct spelling = 1, otherwise = 0. Minor capitalisation errors ignored.",
        explanation: "Predictable letter–sound patterns. Distinguishes encoding ability from vocabulary knowledge. A confident speller of regular words but not irregular ones shows a specific orthographic gap."
      },
      {
        label: "Irregular / high-frequency word", difficulty: "hard",
        audio: { text: '"government"', meta: "Polysyllabic; unstressed middle syllable often reduced in speech (-ern- → /ən/)" },
        instruction: "Type the word you hear.",
        scoring: "Binary: correct spelling = 1, otherwise = 0.",
        explanation: "High-frequency academic word with an unpredictable pattern. Common errors: ‘goverment’ (most common), ‘goverment’, ‘gouvernment’. Error analysis maps specific grapheme confusions — regular vs irregular patterns."
      }
    ]
  },
  {
    stage: 1, kind: "dictation", taskCode: "W2", taskName: "Write from Dictation — Sentence Level",
    subskills: "Spelling in context • Basic punctuation • Working memory for written production",
    description: "Student hears a short sentence (6–12 words, repeated once) and types it. Tests whether spelling degrades under connected-production and working-memory pressure.",
    timing: "~20–30 sec/item • 3–4 items",
    acara: "Beginning–Emerging: spelling and punctuation in connected text.",
    samples: [
      {
        label: "Simple syntax", difficulty: "easy",
        audio: { text: '"The dog is sleeping on the bed."', meta: "6 words, simple SVO, regular vocabulary" },
        instruction: "Type the sentence you hear.",
        scoring: "Partial credit: proportion of content words correctly spelled. Punctuation scored separately.",
        explanation: "Tests the most basic sentence-level encoding: word boundaries, spacing, and common-word spelling, plus a sentence-final full stop and opening capital."
      },
      {
        label: "Complex syntax + irregular spellings", difficulty: "hard",
        audio: { text: '"She couldn’t remember whether the appointment was on Wednesday or Thursday."', meta: "12 words; contraction, connected-speech reductions" },
        instruction: "Type the sentence you hear.",
        scoring: "Partial credit on content words; punctuation (apostrophe, full stop) scored separately.",
        explanation: "Multiple challenge words under working-memory load: ‘couldn’t’ (contraction), ‘whether’ (wh-), ‘appointment’ (double p), ‘Wednesday’ (silent d). Shows whether spelling holds up in connected production."
      }
    ]
  },
  {
    stage: 1, kind: "vocab", taskCode: "W3", taskName: "Vocabulary Completion",
    subskills: "Productive vocabulary breadth • Vocabulary size by frequency band • Word form control",
    description: "Sentence context with the first letters of the target word provided as a cue. The student completes the word. Based on the Productive Vocabulary Levels Test (Laufer & Nation, 1999). The partial-cue format nearly eliminates guessing while tapping genuine recall.",
    timing: "~10–15 sec/item • 15–20 items",
    acara: "Beginning (limited high-frequency vocabulary) → Consolidating (“using precise and varied vocabulary including abstract and evaluative language”).",
    bandDist: "Stratified across frequency bands: 2K (6 items), 3K (5 items), 5K (5 items), and — for Years 10–12 — 10K (4 items).",
    vocabItems: [
      { band: "2K", desc: "Everyday, high-frequency", cue: 'She felt <strong>ner_____</strong> before the exam.', answer: "nervous" },
      { band: "3K", desc: "Common cross-curricular", cue: 'The government decided to <strong>inc_____</strong> taxes.', answer: "increase" },
      { band: "5K", desc: "Academic / less frequent", cue: 'The results were <strong>ina_____</strong> because of errors.', answer: "inaccurate" },
      { band: "10K", desc: "Low-frequency academic (Yrs 10–12)", cue: 'The <strong>ine_____</strong> of the system was widely criticised.', answer: "inefficiency" }
    ],
    scoring: "Binary per item: correctly completed word = 1, otherwise = 0. Band-level scores (% correct at 2K / 3K / 5K / 10K) reported individually.",
    explanation: "The frequency-band architecture provides a vocabulary SIZE estimate, not just an accuracy score. Items must be reviewed so no other English word fits both the letter cue and the sentence context. Also captures morphological control — the student must produce the correct word form for the syntactic slot."
  },
  {
    stage: 1, kind: "cloze", taskCode: "W4", taskName: "Open Cloze",
    subskills: "Function word control (articles, prepositions, auxiliaries, conjunctions) • Lexico-grammatical patterns • Cross-sentence cohesion",
    description: "Short passage (80–120 words) with 6–8 gaps and no word bank. Student types one word per gap. An indirect measure — it tests grammatical resources for writing rather than text production — best used alongside the direct writing tasks.",
    timing: "~2–3 min/passage • 1–2 passages (6–16 gaps)",
    acara: "Emerging–Developing: control of function words and morphosyntax in connected written text.",
    clozeIntro: "Passage vocabulary is held at Emerging–Developing level — the challenge is grammar, not comprehension.",
    clozePassage: [
      "Last weekend my family and I went ", { n: 1 }, " the beach for the first time ", { n: 2 },
      " months. The weather ", { n: 3 }, " perfect, so we stayed all day. ", { n: 4 },
      " the water was cold, my younger brother still wanted to swim. ", { n: 5 },
      " lunch, we built a sandcastle ", { n: 6 }, " collected shells. By the time we left, everyone ", { n: 7 }, " tired but happy."
    ],
    clozeKey: [
      { n: 1, type: "Preposition", answer: "to", alts: "—" },
      { n: 2, type: "Preposition", answer: "in", alts: "for" },
      { n: 3, type: "Auxiliary / copula", answer: "was", alts: "—" },
      { n: 4, type: "Conjunction (concession)", answer: "Although", alts: "Though / While" },
      { n: 5, type: "Discourse connective", answer: "After", alts: "Following" },
      { n: 6, type: "Coordinating conjunction", answer: "and", alts: "—" },
      { n: 7, type: "Auxiliary", answer: "was", alts: "felt" }
    ],
    scoring: "Binary per gap; plausible alternatives accepted (pre-approved in the scoring key). Error pattern reported by gap type: articles, prepositions, auxiliaries, conjunctions, connectives.",
    explanation: "Highly diagnostic for EAL/D. Function words (articles, prepositions) are among the most diagnostic EAL/D features and frequently the last to be mastered. The gap-type breakdown pinpoints exactly which grammatical resources are missing."
  },
  {
    stage: 1, kind: "correction", taskCode: "W5", taskName: "Sentence Correction",
    subskills: "Error detection and correction • Grammatical accuracy",
    description: "Sentence with one underlined error. Student types the corrected sentence. Errors target high-frequency EAL/D developmental patterns: subject–verb agreement, tense marking, article use, preposition selection.",
    timing: "~20–30 sec/item • 3–4 items",
    acara: "Emerging: “grammatical errors that sometimes impede meaning.”",
    samples: [
      {
        label: "Subject–verb agreement", difficulty: "moderate",
        screen: 'The teacher <u>give</u> us homework every day.',
        target: "The teacher gives us homework every day.",
        instruction: "Fix the underlined error and type the corrected sentence.",
        scoring: "Binary: error correctly fixed and sentence otherwise intact = 1.",
        explanation: "One of the most persistent EAL/D errors, especially for speakers of L1s without overt agreement marking (Mandarin, Vietnamese). The error is unambiguous — only one valid correction (give → gives)."
      },
      {
        label: "Preposition selection", difficulty: "moderate",
        screen: 'We arrived <u>to</u> the airport two hours early.',
        target: "We arrived at the airport two hours early.",
        instruction: "Fix the underlined error and type the corrected sentence.",
        scoring: "Binary: error correctly fixed = 1.",
        explanation: "Preposition control is among the most diagnostic EAL/D features. ‘arrive at/in’ vs ‘arrive to’ is a high-frequency confusion that error-type analysis maps directly onto known developmental patterns."
      }
    ]
  },
  {
    stage: 1, kind: "scramble", taskCode: "W6", taskName: "Sentence Construction (Scrambled Words)",
    subskills: "Syntactic control • Word order knowledge",
    description: "Words presented in scrambled order. Student types (or drags) them into a correct sentence. Difficulty gradient reveals whether the student controls simple, compound, or complex syntax.",
    timing: "~20–30 sec/item • 3–4 items",
    acara: "Emerging: “writing simple and compound sentences with increasing accuracy.”",
    samples: [
      {
        label: "Simple SVO", difficulty: "easy",
        words: ["the", "went", "shop", "to", "boy", "the"],
        target: "The boy went to the shop.",
        instruction: "Put these words in order to make a correct sentence.",
        scoring: "Binary: correct order = 1. Only one valid arrangement.",
        explanation: "SVO + prepositional phrase. Tests basic English word order, which many L1s handle differently (SOV in Hindi, Korean, Japanese; VSO in Arabic, Irish)."
      },
      {
        label: "Complex / subordinated", difficulty: "hard",
        words: ["the", "students", "were", "told", "that", "the", "excursion", "had", "been", "cancelled"],
        target: "The students were told that the excursion had been cancelled.",
        instruction: "Put these words in order to make a correct sentence.",
        scoring: "Binary: correct order = 1.",
        explanation: "Passive voice (‘were told’), reported speech (‘that’), and past perfect passive (‘had been cancelled’). Tests whether the student can manage multi-clause structures common in classroom instructions."
      }
    ]
  },
  {
    stage: 1, kind: "combining", taskCode: "W7", taskName: "Sentence Combining",
    subskills: "Sentence complexity • Subordination • Use of connectors",
    description: "Two or three simple sentences are given. Student types a single combined sentence. Multiple valid forms accepted (pre-specified in the scoring key) — richer data than a single-answer item.",
    timing: "~30–45 sec/item • 3–4 items",
    acara: "Developing: “beginning to use complex sentence structures” → Consolidating: “using a range of complex sentences effectively.”",
    exitAfter: {
      label: "Floor Effect — Stage 1 Exit", profile: "Very low Stage 1 performance", phase: "Beginning",
      desc: "Students who perform very poorly across Stage 1 exit here and do not proceed to Stage 2. They receive a diagnostic profile from their discrete-item performance only, classified at the Beginning phase — their writing level is insufficient to produce scorable connected text."
    },
    samples: [
      {
        label: "Concession (subordination expected)", difficulty: "moderate",
        inputs: ["Rosa is tired.", "She still goes to work."],
        target: "Although Rosa is tired, she still goes to work.",
        instruction: "Combine these into one sentence.",
        scoring: "Partial credit: grammatically correct + uses subordination = 2; correct but coordinated only (‘Rosa is tired but she still goes to work’) = 1; incorrect = 0.",
        explanation: "Directly tests the Emerging → Developing transition. Scoring rewards subordination over coordination, so it discriminates students who can only string clauses together (‘and’/‘but’) from those who can subordinate."
      },
      {
        label: "Three-clause combine", difficulty: "hard",
        inputs: ["The film was long.", "It was boring.", "We left early."],
        target: "Because the film was long and boring, we left early.",
        instruction: "Combine these into one sentence.",
        scoring: "Partial credit: subordination + correct = 2; coordination only = 1; incorrect = 0.",
        explanation: "Requires both coordination (‘long and boring’) and subordination (‘Because …, we …’). Multiple valid combined forms are accepted; the scoring key lists the pre-approved alternatives."
      }
    ]
  },

  // ===== STAGE 2: COMMUNICATIVE PRODUCTION =====
  {
    stage: 2, kind: "email", taskCode: "E1", taskName: "Email 1 — Informal",
    subskills: "Register control (informal) • Task fulfilment • ELLIPSE 6 dimensions",
    description: "Student reads a scenario and writes an email. 30 sec planning + 2–3 min writing. Single draft. 40–50 words, sized to fit within the ELLIPSE model’s validated 64-token window.",
    timing: "~3 min • All years (7–12)",
    register: "Informal — friend, classmate, or peer",
    sample: {
      to: "Sam",
      subject: "Today’s science class",
      scenario: "Your friend Sam is in your science class but was away today. Email Sam to let them know what happened in class and what homework was set.",
      contentPoints: [
        "Say what happened in class today",
        "Tell Sam what homework was set",
        "Sign off naturally (informal)"
      ],
      greeting: "“Hey Sam,” … “See ya, [name]”"
    }
  },
  {
    stage: 2, kind: "email", taskCode: "E2", taskName: "Email 2 — Semi-Formal",
    subskills: "Register control (semi-formal) • Task fulfilment • ELLIPSE 6 dimensions",
    description: "Student reads a scenario and writes an email. 30 sec planning + 2–3 min writing. Single draft. 40–50 words. A different communicative situation from Email 1 — not the same message rewritten.",
    timing: "~3 min • All years (7–12)",
    register: "Semi-formal — class teacher, coach, or school librarian",
    sample: {
      to: "Mr Patel (basketball coach)",
      subject: "Missing training next Tuesday",
      scenario: "You need to miss basketball training next Tuesday because of a family event. Email your coach, Mr Patel, to let him know and ask if you can make it up.",
      contentPoints: [
        "Explain that you must miss Tuesday’s training",
        "Give a brief reason",
        "Ask whether you can make it up"
      ],
      greeting: "“Hi Mr Patel,” … “Thanks, [name]”"
    }
  },
  {
    stage: 2, kind: "email", taskCode: "E3", taskName: "Email 3 — Formal",
    subskills: "Register control (formal) • Task fulfilment • ELLIPSE 6 dimensions",
    description: "Student reads a scenario and writes an email to an external adult. 30 sec planning + 2–3 min writing. Single draft. 40–50 words. Tests the shift from school-internal to external register.",
    timing: "~3 min • All years (7–12)",
    register: "Formal — external contact (organisation, principal, work-experience host)",
    sample: {
      to: "Library Manager",
      subject: "Volunteering during the school holidays",
      scenario: "You would like to volunteer at your local library during the school holidays. Write an email to the library manager to introduce yourself and ask about volunteer opportunities.",
      contentPoints: [
        "Introduce yourself",
        "Explain that you would like to volunteer",
        "Ask about volunteer opportunities and how to apply"
      ],
      greeting: "“Dear Ms Nguyen,” … “Kind regards, [full name]”"
    }
  },
  {
    stage: 2, kind: "essay", taskCode: "ESS", taskName: "Persuasive / Evaluative Essay",
    subskills: "Task achievement • Argument & evaluation • IELTS 5 dimensions",
    description: "Student reads a short stimulus (forum post, proposal, opinion prompt) and writes a response. 30 sec planning + 8 min writing. Single draft. 100–200 words, well within the IELTS model’s 512-token window. Must require genuine evaluation or persuasion, not a mere opinion statement.",
    timing: "~9 min • Years 10–12 only",
    register: "Formal / academic — general reader / school forum",
    sample: {
      to: "Student Council forum",
      subject: "Should community service be compulsory for Year 11?",
      scenario: "Your school is considering making community service compulsory for all Year 11 students. The student council has asked for written responses. Write your view, explaining your reasons.",
      contentPoints: [
        "State your position clearly",
        "Give reasons supported with detail or examples",
        "Acknowledge or address an opposing view",
        "Conclude with a clear recommendation"
      ]
    }
  },

  // ===== SCORING & DIAGNOSTIC OUTPUT =====
  {
    stage: 0, kind: "scoring", taskCode: "OUT", taskName: "Scoring & Diagnostic Output",
    subskills: "Stage 1 sub-skill scores • ELLIPSE & IELTS dimensions • Unified profile",
    description: "The DWA produces an overall writing score plus a granular sub-skill profile. Stage 1 discrete scores ARE the diagnosis; Stage 2 ML scores add integrated, authentic writing dimensions. Both feed a single-page unified diagnostic profile aligned to ACARA EAL/D phases.",
    timing: "Reporting"
  }
];

const ELLIPSE_DIMS = [
  ["Cohesion", "How well ideas are linked"],
  ["Syntax", "How accurately sentences are formed"],
  ["Vocabulary", "How precisely words are chosen"],
  ["Phraseology", "How naturally phrases and collocations are used"],
  ["Grammar", "How accurately grammatical structures are controlled"],
  ["Conventions", "How accurately spelling and punctuation are used"]
];

const IELTS_DIMS = [
  ["Task Achievement", "How fully the prompt is addressed", "1–9 → 1–5"],
  ["Coherence & Cohesion", "How well the text is organised and linked", "1–9 → 1–5"],
  ["Vocabulary", "How appropriately words are chosen", "1–9 → 1–5"],
  ["Grammar", "How accurately grammar is controlled", "1–9 → 1–5"],
  ["Overall", "Composite score", "1–9 → 1–5"]
];

const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
let activeTaskIdx = 0;

function renderSidebar() {
  let html = '';
  const stages = [
    { num: 1, label: 'STAGE 1: Discrete / Constrained', time: '~14–17 min' },
    { num: 2, label: 'STAGE 2: Communicative Production', time: '~9 min (Yrs 7–9) / ~18 min (Yrs 10–12)' },
    { num: 0, label: 'Scoring & Diagnostic Output', time: '' }
  ];
  stages.forEach(stage => {
    const tasks = TASKS.filter(t => t.stage === stage.num);
    if (!tasks.length) return;
    html += `<div class="sidebar-section"><div class="stage-label">${stage.label} <span class="stage-time">${stage.time}</span></div>`;
    tasks.forEach(task => {
      const gi = TASKS.indexOf(task);
      html += `<div class="nav-item ${gi === activeTaskIdx ? 'active' : ''}" onclick="selectTask(${gi})"><span class="task-code">${task.taskCode}</span><span>${task.taskName}</span></div>`;
    });
    html += '</div>';
  });
  sidebar.innerHTML = html;
}

function elementsToHtml(parts) {
  return parts.map(p => typeof p === 'string' ? p : `<span class="gap-blank">(${p.n})</span>`).join('');
}

function renderTask(idx) {
  const task = TASKS[idx];
  activeTaskIdx = idx;
  renderSidebar();

  let html = `<div class="task-header">
    <div class="task-type-badge">${task.stage > 0 ? 'Stage ' + task.stage + ' • ' : ''}${task.taskCode} &mdash; ${task.timing}</div>
    <h2>${task.taskName}</h2>
    <div class="subskills">Sub-skills: ${task.subskills}</div>
    <div class="description">${task.description}</div>
  </div>`;

  if (task.acara) {
    html += `<div class="acara-note"><div class="acara-label">ACARA EAL/D alignment</div>${task.acara}</div>`;
  }

  // ---- DICTATION / CORRECTION / SCRAMBLE / COMBINING (item-based) ----
  if (['dictation', 'correction', 'scramble', 'combining'].includes(task.kind)) {
    task.samples.forEach(sample => {
      html += `<div class="item-card"><div class="item-label">${sample.label} <span class="difficulty ${sample.difficulty}">${sample.difficulty}</span></div><div class="card-body">`;

      if (sample.audio) {
        html += `<div class="audio-box"><div class="audio-label">🎧 What the student hears</div><div class="audio-text">${sample.audio.text}</div><div class="audio-meta">${sample.audio.meta}</div></div>`;
      }
      if (sample.screen) {
        html += `<div class="prompt-box"><div class="prompt-label">💻 On screen</div><div class="prompt-text" style="font-size:16px">${sample.screen}</div><div class="prompt-meta">Target: <strong>${sample.target}</strong></div></div>`;
      }
      if (sample.words) {
        html += `<div class="prompt-box"><div class="prompt-label">💻 On screen (scrambled)</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">`;
        sample.words.forEach(w => { html += `<span class="word-chip">${w}</span>`; });
        html += `</div><div class="prompt-meta">Target: <strong>${sample.target}</strong></div></div>`;
      }
      if (sample.inputs) {
        html += `<div class="prompt-box"><div class="prompt-label">💻 Given sentences</div>`;
        sample.inputs.forEach(s => { html += `<div style="font-size:15px">• ${s}</div>`; });
        html += `<div class="prompt-meta">Sample target: <strong>${sample.target}</strong></div></div>`;
      }

      html += `<div class="typing-box"><div class="typing-label">✍️ ${sample.instruction}</div><div class="typing-input">Student types here…</div></div>`;
      html += `<div class="scoring-box"><div class="scoring-label">✅ Scoring</div><div class="scoring-text">${sample.scoring}</div></div>`;
      html += `<div class="explanation"><div class="exp-label">Diagnostic Notes</div>${sample.explanation}</div>`;
      html += '</div></div>';
    });
  }

  // ---- VOCABULARY COMPLETION ----
  else if (task.kind === 'vocab') {
    html += `<div class="item-card"><div class="item-label">Frequency-band structure</div><div class="card-body">
      <div style="font-size:13px;margin-bottom:10px">${task.bandDist}</div>
      <table class="data-table"><tr><th>Band</th><th>Word type</th><th>Sample item (first-letter cue)</th><th>Answer</th></tr>`;
    task.vocabItems.forEach(v => {
      html += `<tr><td class="band-num">${v.band}</td><td>${v.desc}</td><td>${v.cue}</td><td><strong>${v.answer}</strong></td></tr>`;
    });
    html += `</table></div></div>`;
    html += `<div class="item-card"><div class="item-label">Sample interaction (2K item)</div><div class="card-body">
      <div class="prompt-box"><div class="prompt-label">💻 On screen</div><div class="prompt-text" style="font-size:16px">She felt <strong>ner_____</strong> before the exam.</div></div>
      <div class="typing-box"><div class="typing-label">✍️ Complete the word.</div><div class="typing-input">nervous</div></div>
      <div class="scoring-box"><div class="scoring-label">✅ Scoring</div><div class="scoring-text">${task.scoring}</div></div>
      <div class="explanation"><div class="exp-label">Diagnostic Notes</div>${task.explanation}</div>
    </div></div>`;
  }

  // ---- OPEN CLOZE ----
  else if (task.kind === 'cloze') {
    html += `<div class="item-card"><div class="item-label">Sample passage (80–120 words, no word bank)</div><div class="card-body">
      <div style="font-size:12.5px;color:var(--grey);margin-bottom:10px">${task.clozeIntro}</div>
      <div class="prompt-box"><div class="prompt-label">💻 On screen</div><div class="prompt-text" style="font-size:16px;line-height:2">${elementsToHtml(task.clozePassage)}</div></div>
      <table class="data-table"><tr><th>Gap</th><th>Type</th><th>Answer</th><th>Accepted alternatives</th></tr>`;
    task.clozeKey.forEach(k => {
      html += `<tr><td class="band-num">${k.n}</td><td>${k.type}</td><td><strong>${k.answer}</strong></td><td>${k.alts}</td></tr>`;
    });
    html += `</table>
      <div class="scoring-box" style="margin-top:14px"><div class="scoring-label">✅ Scoring</div><div class="scoring-text">${task.scoring}</div></div>
      <div class="explanation"><div class="exp-label">Diagnostic Notes</div>${task.explanation}</div>
    </div></div>`;
  }

  // ---- EMAIL ----
  else if (task.kind === 'email') {
    const s = task.sample;
    html += `<div class="acara-note" style="background:var(--email-bg);border-left-color:var(--email-accent)"><div class="acara-label" style="color:var(--email-accent)">Register</div>${task.register}</div>`;
    html += `<div class="item-card"><div class="item-label">Sample prompt</div><div class="card-body">`;
    html += `<div class="prompt-box"><div class="prompt-label">📋 Scenario</div><div class="prompt-text">${s.scenario}</div>
      <div style="margin-top:10px"><strong>Content points (2–3 specified):</strong><ul style="margin-left:20px;margin-top:4px">`;
    s.contentPoints.forEach(cp => { html += `<li style="font-size:13px">${cp}</li>`; });
    html += `</ul></div><div class="prompt-meta">Format conventions: ${s.greeting}</div></div>`;
    html += `<div class="email-interface">
        <div class="email-header">📧 New Email</div>
        <div class="email-fields"><div><span class="label">To:</span> ${s.to}</div><div><span class="label">Subject:</span> ${s.subject}</div></div>
        <div class="email-body"><div class="typing-input large">Student writes 40–50 words here… (30 sec planning + 2–3 min writing, single draft)</div></div>
      </div>`;
    html += `<div class="ml-box"><div class="ml-label">🤖 Scored by ELLIPSE model — 6 dimensions (1–5)</div>
      <div class="ml-stats">`;
    ELLIPSE_DIMS.forEach(d => { html += `<span class="ml-stat">${d[0]}</span>`; });
    html += `</div><div class="ml-text" style="margin-top:8px"><strong>+ Task fulfilment</strong> checked separately: Fully / Partially / Not addressed.</div></div>`;
    html += `<div class="explanation"><div class="exp-label">Diagnostic Notes</div>Comparing ELLIPSE scores across all three emails (informal → semi-formal → formal) builds a <strong>register flexibility profile</strong>: can the student shift vocabulary, phraseology, and grammar as the audience becomes more formal, or does accuracy degrade under formal demands?</div>`;
    html += '</div></div>';
  }

  // ---- ESSAY ----
  else if (task.kind === 'essay') {
    const s = task.sample;
    html += `<div class="acara-note" style="background:var(--email-bg);border-left-color:var(--email-accent)"><div class="acara-label" style="color:var(--email-accent)">Register</div>${task.register}</div>`;
    html += `<div class="item-card"><div class="item-label">Sample prompt</div><div class="card-body">`;
    html += `<div class="prompt-box"><div class="prompt-label">📋 Stimulus</div><div class="prompt-text">${s.scenario}</div>
      <div style="margin-top:10px"><strong>Content / argument points (3–4 specified):</strong><ul style="margin-left:20px;margin-top:4px">`;
    s.contentPoints.forEach(cp => { html += `<li style="font-size:13px">${cp}</li>`; });
    html += `</ul></div></div>`;
    html += `<div class="email-interface">
        <div class="email-header" style="background:var(--write-accent)">📝 Written Response</div>
        <div class="email-fields"><div><span class="label">Forum:</span> ${s.to}</div><div><span class="label">Prompt:</span> ${s.subject}</div></div>
        <div class="email-body"><div class="typing-input large">Student writes 100–200 words here… (30 sec planning + 8 min writing, single draft)</div></div>
      </div>`;
    html += `<div class="ml-box"><div class="ml-label">🤖 Scored by IELTS model — 5 dimensions (1–9, mapped to 1–5)</div>
      <div class="ml-stats">`;
    IELTS_DIMS.forEach(d => { html += `<span class="ml-stat">${d[0]}</span>`; });
    html += `</div><div class="ml-text" style="margin-top:8px">Task Achievement is built into the model — no separate fulfilment check needed.</div></div>`;
    html += `<div class="explanation"><div class="exp-label">Diagnostic Notes</div>The essay surfaces higher-order rhetorical ability — idea development, use of evidence, argument structure, and evaluative stance — that the short emails cannot. Administered to Years 10–12 only.</div>`;
    html += '</div></div>';
  }

  // ---- SCORING & DIAGNOSTIC OUTPUT ----
  else if (task.kind === 'scoring') {
    // Two-model scoring architecture
    html += `<div class="item-card"><div class="item-label">Two-Model Scoring Architecture (Stage 2)</div><div class="card-body">
      <div style="font-size:13px;margin-bottom:14px;color:var(--grey)">Stage 2 uses two ML models, each applied to the task type it was trained for. Short, authentic writing samples are used because research (Runge et al., 2025) confirms they produce stable, reliable ML scores.</div>`;

    html += `<div class="ml-box"><div class="ml-label">🤖 Model 1 — ELLIPSE (KevSun/Engessay_grading_ML) • for the 3 emails</div>
      <div class="ml-text">Trained on ~6,500 ELL writing samples (grades 8–12, ELLIPSE corpus). Applied per email; outputs 6 analytic dimensions on a 1–5 scale. The 40–50 word emails fit inside its validated 64-token window.</div>
      <div class="ml-stats"><span class="ml-stat">64-token window</span><span class="ml-stat">Accuracy 0.91</span><span class="ml-stat">F1 0.90</span><span class="ml-stat">QWK 0.85</span></div>
      <table class="data-table"><tr><th>Dimension</th><th>What it captures</th><th>Scale</th></tr>`;
    ELLIPSE_DIMS.forEach(d => { html += `<tr><td><strong>${d[0]}</strong></td><td>${d[1]}</td><td>1–5</td></tr>`; });
    html += `</table></div>`;

    html += `<div class="ml-box"><div class="ml-label">🤖 Model 2 — IELTS (KevSun/IELTS_essay_scoring) • for the persuasive essay</div>
      <div class="ml-text">Trained on ~18,000 real IELTS exam essays with official scores. Outputs 5 dimensions on a 1–9 scale (mapped to 1–5 for reporting). Includes Task Achievement and an Overall score — exactly what the persuasive essay needs. 100–200 words fit comfortably in its 512-token window. Years 10–12 only.</div>
      <div class="ml-stats"><span class="ml-stat">512-token window</span><span class="ml-stat">Accuracy 0.82</span><span class="ml-stat">F1 0.81</span></div>
      <table class="data-table"><tr><th>Dimension</th><th>What it captures</th><th>Scale</th></tr>`;
    IELTS_DIMS.forEach(d => { html += `<tr><td><strong>${d[0]}</strong></td><td>${d[1]}</td><td>${d[2]}</td></tr>`; });
    html += `</table></div>`;

    html += `<div class="explanation"><div class="exp-label">Task fulfilment check (emails only)</div>The ELLIPSE model does not assess whether the student addressed the prompt. A separate task-fulfilment check (automated content-point detection or human/AI rubric) is layered on top of each email and scored as <strong>Fully addressed / Partially addressed / Not addressed</strong>.</div>`;
    html += `</div></div>`;

    // Stage 1 sub-skill scores
    html += `<div class="item-card"><div class="item-label">Stage 1 sub-skill scores</div><div class="card-body"><table class="data-table">
      <tr><th>Sub-skill</th><th>Source task(s)</th><th>Score type</th></tr>
      <tr><td>Spelling accuracy</td><td>W1, W2</td><td>% correct</td></tr>
      <tr><td>Productive vocabulary size</td><td>W3</td><td>% correct by band (2K, 3K, 5K, 10K)</td></tr>
      <tr><td>Function word control</td><td>W4</td><td>% correct by gap type</td></tr>
      <tr><td>Grammatical accuracy</td><td>W5, W6</td><td>% correct</td></tr>
      <tr><td>Sentence complexity</td><td>W7</td><td>Mean score (0–2 scale)</td></tr>
    </table></div></div>`;

    // Reporting bands
    html += `<div class="item-card"><div class="item-label">Overall writing score — reporting bands (ACARA EAL/D phases)</div><div class="card-body"><table class="data-table">
      <tr><th>Band</th><th>Label</th><th>EAL/D Phase</th></tr>
      <tr><td class="band-num">5</td><td style="font-weight:600">Advanced</td><td>Above Consolidating</td></tr>
      <tr><td class="band-num">4</td><td style="font-weight:600">Consolidating</td><td>Consolidating</td></tr>
      <tr><td class="band-num">3</td><td style="font-weight:600">Developing</td><td>Developing</td></tr>
      <tr><td class="band-num">2</td><td style="font-weight:600">Emerging</td><td>Emerging</td></tr>
      <tr><td class="band-num">1</td><td style="font-weight:600">Beginning</td><td>Beginning</td></tr>
    </table><div style="margin-top:12px;font-size:12px;color:var(--grey)"><strong>Composite (to be confirmed during piloting):</strong> Stage 1 “Language Control” composite + mean ELLIPSE email score + IELTS Overall (where applicable), weighted and scaled to a reporting band.</div></div></div>`;

    // Unified profile
    html += `<div class="item-card"><div class="item-label">The unified diagnostic profile (single page per student)</div><div class="card-body">
      <ol style="margin-left:20px;font-size:13px;line-height:1.8">
        <li><strong>Overall Writing Score</strong> — band 1–5 with ACARA phase label</li>
        <li><strong>Stage 1 Sub-Skill Map</strong> — all discrete sub-skill scores, strengths and weaknesses</li>
        <li><strong>Stage 2 Email Scores</strong> — 6 ELLIPSE dimensions per email, with cross-email comparison</li>
        <li><strong>Stage 2 Essay Scores</strong> (Yrs 10–12) — 5 IELTS dimensions</li>
        <li><strong>Task Fulfilment Summary</strong> — per email</li>
        <li><strong>Register Flexibility Profile</strong> — how scores change informal → semi-formal → formal</li>
        <li><strong>Actionable Recommendations</strong> — auto-generated from the profile</li>
      </ol></div></div>`;

    // Stage 1 <-> Stage 2 mapping
    html += `<div class="item-card"><div class="item-label">Mapping Stage 1 ↔ Stage 2 (consistency checks)</div><div class="card-body"><table class="data-table">
      <tr><th>Stage 1 sub-skill</th><th>Stage 2 dimension</th><th>Consistency check</th></tr>
      <tr><td>Spelling accuracy (W1–W2)</td><td>ELLIPSE: Conventions</td><td>Strong spelling but weak Conventions → investigate punctuation/formatting.</td></tr>
      <tr><td>Vocabulary size (W3)</td><td>ELLIPSE: Vocabulary, Phraseology</td><td>Mastery at 2K but failure at 3K with moderate ML Vocabulary → has high-frequency words, lacks academic vocabulary.</td></tr>
      <tr><td>Function word control (W4)</td><td>ELLIPSE: Grammar, Cohesion</td><td>Weak cloze but adequate ML Grammar → implicit grammar in production, explicit gaps in function words.</td></tr>
      <tr><td>Grammatical accuracy (W5–W6)</td><td>ELLIPSE: Grammar, Syntax</td><td>Direct parallel — should be consistent.</td></tr>
      <tr><td>Sentence complexity (W7)</td><td>ELLIPSE: Syntax</td><td>Weak combining but adequate Syntax → produces simple sentences well but avoids complexity.</td></tr>
    </table></div></div>`;
  }

  // Exit / floor banner (Stage 1 boundary)
  if (task.exitAfter) {
    html += `<div class="exit-banner"><span class="exit-icon">🚨</span><div><div class="exit-text">${task.exitAfter.label} — ${task.exitAfter.profile}</div><div class="exit-detail">ACARA phase: ${task.exitAfter.phase}<br>${task.exitAfter.desc}</div></div></div>`;
  }

  // Nav
  html += '<div style="display:flex;justify-content:space-between;margin-top:20px">';
  if (idx > 0) html += `<button class="nav-btn secondary" onclick="selectTask(${idx-1})">← ${TASKS[idx-1].taskName}</button>`;
  else html += '<div></div>';
  if (idx < TASKS.length - 1) html += `<button class="nav-btn" onclick="selectTask(${idx+1})">${TASKS[idx+1].taskName} →</button>`;
  html += '</div>';

  main.innerHTML = html;
  window.scrollTo(0, 0);
}

function selectTask(idx) { renderTask(idx); }
renderTask(0);
</script>
</body>
</html>
